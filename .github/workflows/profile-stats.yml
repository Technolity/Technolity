name: Update Profile Stats

on:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC
  push:
    paths:
      - ".github/workflows/profile-stats.yml"
  workflow_dispatch: # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=technolity&theme=dark&hide_border=true&background=0D1117&ring=DC2A3C&fire=DC2A3C&currStreakLabel=DC2A3C&sideNums=C9D1D9&sideLabels=8B949E&dates=6E7681&date_format=j%20M%5B%20Y%5D
          path: profile/streak.svg

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: technolity
          options: bg_color=0D1117&color=F0F6FC&line=DC2A3C&point=FFFFFF&area=true&area_color=DC2A3C&hide_border=true&custom_title=Contribution%20Activity
          output_path: profile/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg profile/activity-graph.svg
          git commit -m "chore: update streak + activity graph" || exit 0
          git push
